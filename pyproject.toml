[project]
name = "job-apply-agent"
version = "0.2.0"
description = "简历画像驱动的校招岗位匹配与求职信生成 Agent（改造中：JobMatch-Agent）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "pypdf>=4.0.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = []
